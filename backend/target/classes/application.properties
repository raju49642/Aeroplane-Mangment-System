spring.application.name=ams-backend

# ---- Database configuration ----
spring.datasource.url=jdbc:mysql://localhost:3306/ams_db
spring.datasource.username=root
spring.datasource.password=Raju@8179
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# ---- JWT ----
# Must be a long random string (32+ chars) in any real deployment; override via env var.
ams.jwt.secret=${JWT_SECRET:this-is-a-development-only-secret-key-please-override-me-in-prod}
ams.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Initial Super Admin bootstrap (see SuperAdminInitializer) ----
ams.super-admin.username=Raju
ams.super-admin.password=Raju@8179
ams.super-admin.security-sport=${SUPER_ADMIN_SECURITY_SPORT:}
ams.super-admin.security-hobby=${SUPER_ADMIN_SECURITY_HOBBY:}

# A pragmatic typo-catcher only; this does not verify email ownership.
ams.email.allowed-domains=gmail.com,yahoo.com,outlook.com,hotmail.com,icloud.com,protonmail.com

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
